name: Shinya macOS release
run-name: Shinya macOS arm64 · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: shinya-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'senshinya/herdr-gpui' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
      version: ${{ steps.version.outputs.version }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: none
      HERDR_BUILD_PR_NUMBER: ''
      HERDR_UPDATE_PUBLIC_KEY: ''
      HOMEBREW_NO_AUTO_UPDATE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.26.7'
          cache: false
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install just
          rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: shinya-macos-arm64
      - name: Resolve the fork version
        id: version
        run: python3 scripts/release/shinya-build.py version --github-output "$GITHUB_OUTPUT"
      - name: Verify the upstream base
        env:
          UPSTREAM_COMMIT: ${{ steps.version.outputs.upstream_commit }}
        run: git merge-base --is-ancestor "$UPSTREAM_COMMIT" "$GITHUB_SHA"
      - name: Build the native app and its companions
        env:
          HERDR_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: just bundle release
      - name: Generate third-party notices
        run: python3 scripts/release/generate-notices.py "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
      - name: Stamp, check, and archive the app
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          mkdir -p dist
          app=target/release/Herdr.app
          python3 scripts/release/shinya-build.py stamp \
            --bundle "$app" --notices "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt" \
            --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" \
            --output-info dist/build-info.json
          test "$(lipo -archs "$app/Contents/MacOS/Herdr")" = arm64
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          python3 scripts/release/smoke-cli.py "$app/Contents/MacOS/Herdr"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$ARTIFACT_NAME.zip"
          (cd dist && shasum -a 256 "$ARTIFACT_NAME.zip" > "$ARTIFACT_NAME.zip.sha256")
          {
            printf '### %s\n\n' "$ARTIFACT_NAME"
            printf 'Fork commit: %s\n\n' "$GITHUB_SHA"
            printf 'Development build: ad-hoc signed, without notarization\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'senshinya/herdr-gpui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: git-cliff@2.12.0
          fallback: none
      - name: Generate release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          {
            printf 'macOS Apple Silicon, macOS 14.2+. Ad-hoc signed; not notarized.\n\n'
            printf 'Upstream base: %s. Fork source: %s.\n\n' "$UPSTREAM_COMMIT" "$GITHUB_SHA"
          } > "$RUNNER_TEMP/RELEASE_NOTES.md"
          git-cliff --config cliff.toml --tag "v$VERSION" --strip header \
            "$UPSTREAM_COMMIT..$GITHUB_SHA" >> "$RUNNER_TEMP/RELEASE_NOTES.md"
      - name: Verify and publish the build
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && shasum -a 256 -c "$ARTIFACT_NAME.zip.sha256")
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft \
            --title "Herdr $VERSION" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" dist/*
          gh release edit "v$VERSION" --draft=false --latest
